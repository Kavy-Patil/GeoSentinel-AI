name: GeoSentinel AI CI Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Automated Unit, Component, Security & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit, Security & Component Tests
        run: pnpm test

      - name: Generate Code Coverage Report
        run: pnpm run test:coverage

      - name: Run Security Audit Suite
        run: python3 tests/run_full_audit.py

      - name: Build Next.js Production Static Export
        run: pnpm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm run test:e2e
        env:
          CI: true
